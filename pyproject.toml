[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
version = "0.1.0"
description = "Pipeline RAG moderne : recherche hybride (BM25 + dense, RRF), reranking, citations et évaluation. API FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
chroma = ["chromadb>=0.5"]
pdf = ["pypdf>=5.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ragforge-ingest = "ragforge.ingest:main"
ragforge-eval = "ragforge.evaluation.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
